<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>數位發展部 採購資源整合平台</title>
  <style>
html {
  scrollbar-gutter: stable;
}
@supports not (scrollbar-gutter: stable) {
  html { overflow-y: scroll; }
}

    :root{
      --moda-yellow:#F4EA5A; /* PANTONE 101C */
      --moda-gray:#7B868C;   /* PANTONE 430C */
      --ink:#0F172A;
      --muted:#64748B;
      --line:#E2E8F0;
      --bg:#F8FAFC;
      --card:#FFFFFF;
      --navy:#0B1F44;
      --blue:#2563EB;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      font-family: "Poppins","Noto Sans TC","PingFang TC","Microsoft JhengHei","Segoe UI",Arial,sans-serif;
      color:var(--ink);
      background: linear-gradient(180deg, #F8FAFC 0%, #F1F5F9 100%);
      line-height:1.55;
    }

    /* Header */
    .site-header{
      position: sticky; top:0; z-index:1000;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
    }
    .header-wrap{
      max-width: 1200px; margin:0 auto; padding: 10px 16px;
      display:flex; align-items:center; gap:12px;
    }
    .brand{
      display:flex; align-items:center; gap:10px; min-width:0; text-decoration:none; color:inherit;
    }
    .brand-logo{height:28px; width:auto; display:block; flex:0 0 auto;}
    .brand-text{font-weight:700; color:#0F172A; letter-spacing:.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
    .brand-dot{
      width:12px; height:12px; border-radius:999px; background:var(--blue);
      box-shadow: 0 0 0 4px rgba(37,99,235,.12);
      display:inline-block;
    }

    .spacer{flex:1}
    .nav-toggle{
      display:none; border:1px solid var(--line); background:#fff; color:#334155;
      width:40px; height:40px; border-radius:12px; cursor:pointer;
      align-items:center; justify-content:center;
    }
    .nav-toggle svg{width:20px;height:20px}
    .site-nav{
      display:flex; gap:6px; align-items:center; flex-wrap:wrap;
    }
    .nav-link{
      text-decoration:none; color:#334155; font-weight:600;
      padding:10px 14px; border-radius:999px; border:1px solid transparent;
      transition:.2s ease;
    }
    .nav-link:hover{background:#fff; border-color:var(--line); color:#0F172A; box-shadow:0 2px 10px rgba(15,23,42,.06)}
    .nav-link.active{
      background: linear-gradient(180deg, rgba(37,99,235,.10), rgba(37,99,235,.08));
      color:var(--blue);
      border-color: rgba(37,99,235,.18);
    }

    /* Page */
    .page-wrap{max-width: 1200px; margin:0 auto; padding: 22px 16px 36px;}
    .hero-card{
      background:rgba(255,255,255,.86);
      border:1px solid var(--line);
      border-radius:26px;
      box-shadow: 0 12px 40px rgba(15,23,42,.05);
      padding: clamp(20px, 3vw, 34px);
      overflow:hidden;
      position:relative;
    }
    .hero-card::before{
      content:"";
      position:absolute; inset:0 auto auto 0;
      width:100%; height:7px;
      background: linear-gradient(90deg, var(--moda-yellow), #fff3a6, #dbeafe);
    }
    .hero-top{
      display:flex; justify-content:center; margin-top:6px; margin-bottom:10px;
    }
    .hero-chip{
      display:inline-flex; align-items:center; gap:8px;
      background:#fff;
      border:1px solid var(--line);
      border-radius:999px;
      padding:8px 12px;
      color:#475569; font-weight:600; font-size:14px;
      box-shadow:0 4px 14px rgba(15,23,42,.04);
    }
    .hero-chip .dot{width:8px;height:8px;border-radius:999px;background:var(--moda-yellow); border:1px solid rgba(0,0,0,.08);}
    .hero-title{
      margin:0;
      text-align:center;
      color:var(--navy);
      font-weight:800;
      letter-spacing:.4px;
      font-size: clamp(28px, 4vw, 40px);
    }
    .hero-desc{
      margin:14px auto 0;
      max-width: 860px;
      text-align:center;
      color:#475569;
      font-size: clamp(15px, 2vw, 18px);
    }

    .cards-grid{
      margin-top: 24px;
      display:grid;
      grid-template-columns: repeat(12, minmax(0,1fr));
      gap: 14px;
      align-items:stretch;
    }
    .card-link{
      grid-column: span 4;
      background: rgba(255,255,255,.92);
      border:1px solid #DCE3EA;
      border-radius: 20px;
      padding: 16px 16px 14px;
      text-decoration:none;
      color:inherit;
      box-shadow: 0 6px 20px rgba(15,23,42,.04);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
      position:relative;
      overflow:hidden;
      min-height: 126px;
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
    }
    .card-link::after{
      content:"";
      position:absolute; left:0; top:0; height:100%; width:4px;
      background: linear-gradient(180deg, var(--moda-yellow), #fde68a);
      opacity:0;
      transition:opacity .18s ease;
    }
    .card-link:hover{
      transform: translateY(-3px);
      border-color:#CBD5E1;
      box-shadow: 0 14px 28px rgba(15,23,42,.08);
      background:#fff;
    }
    .card-link:hover::after{opacity:1}
    .card-link:active{transform: translateY(-1px)}
    .card-head{
      display:flex; align-items:center; gap:10px;
      margin-bottom:8px;
    }
    .icon-wrap{
      width:38px; height:38px; border-radius:12px;
      background: linear-gradient(180deg, rgba(244,234,90,.45), rgba(244,234,90,.22));
      border:1px solid rgba(123,134,140,.18);
      display:inline-flex; align-items:center; justify-content:center;
      color:#334155;
      flex:0 0 auto;
    }
    .icon-wrap svg{width:20px;height:20px}
    .card-title{
      font-size: clamp(18px,2vw,20px);
      line-height:1.2;
      font-weight: 800;
      color: var(--navy);
      margin:0;
    }
    .card-sub{
      margin: 2px 0 0;
      color: #5B6B7D;
      font-size: 14px;
      line-height: 1.55;
    }

    .footer-note{
      margin-top:14px;
      text-align:center;
      color:#64748B;
      font-size:12px;
    }

    @media (max-width: 980px){
      .card-link{grid-column: span 6; min-height: 132px;}
      .site-nav{gap:2px}
      .nav-link{padding:8px 10px; font-size:14px}
    }
    @media (max-width: 720px){
      .header-wrap{padding:10px 12px}
      .brand-text{font-size:14px}
      .nav-toggle{display:inline-flex}
      .site-nav{
        position: absolute; left:12px; right:12px; top:62px;
        background:#fff; border:1px solid var(--line); border-radius:16px;
        box-shadow:0 16px 38px rgba(15,23,42,.10);
        padding:8px;
        display:none;
        flex-direction:column;
        align-items:stretch;
      }
      .site-header.nav-open .site-nav{display:flex}
      .nav-link{border-radius:12px; padding:10px 12px}
      .cards-grid{gap:12px}
      .card-link{grid-column: span 12; min-height:auto}
      .hero-card{border-radius:20px}
      .hero-chip{font-size:13px}
    }
  
/* === MODA card hover accent (match homepage yellow highlight) === */
.page-wrap .space-y-4 > .bg-white.rounded-xl.shadow-md{
  position: relative;
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
  border: 1px solid rgba(220, 227, 234, 1);
}
.page-wrap .space-y-4 > .bg-white.rounded-xl.shadow-md::after{
  content: "";
  position: absolute;
  left: 0; top: 0;
  width: 4px; height: 100%;
  background: linear-gradient(180deg, var(--moda-yellow), #fde68a);
  opacity: 0;
  transition: opacity .18s ease;
  pointer-events: none;
  z-index: 2;
}
.page-wrap .space-y-4 > .bg-white.rounded-xl.shadow-md:hover{
  transform: translateY(-2px);
  box-shadow: 0 14px 28px rgba(15, 23, 42, .08);
  border-color: #CBD5E1;
}
.page-wrap .space-y-4 > .bg-white.rounded-xl.shadow-md:hover::after{
  opacity: 1;
}
/* keep reduced motion users comfortable */
@media (prefers-reduced-motion: reduce){
  .page-wrap .space-y-4 > .bg-white.rounded-xl.shadow-md{
    transition: none;
  }
  .page-wrap .space-y-4 > .bg-white.rounded-xl.shadow-md::after{
    transition: none;
  }
}

</style>

<!-- MODA unified theme overrides -->
<style id="moda-unified-theme-overrides">

  .site-nav .nav-link.is-active,

<style id="moda-theme-fix-v2">

  --moda-yellow-fix:#F4EA5A;
  --moda-navy-fix:#0B1F44;
  --moda-gray-fix:#7B868C;
}

  border-color: rgba(123,134,140,.16) !important;
  box-shadow: inset 0 0 0 1px rgba(123,134,140,.10) !important;

/* Homepage hover (keep yellow feel if any active styles were blue) */
.site-nav .nav-link:hover{
  color: #0F172A;
}

@media (hover:hover){

  .page-wrap .bg-white.rounded-xl.shadow-md.overflow-hidden,
  .page-wrap .law-item.bg-white.rounded-xl.shadow-md{
    position: relative !important;
    overflow: hidden !important; /* clips the accent inside rounded corners */
    isolation: isolate;
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
    border: 1px solid rgba(220,227,234,1);
  }

  /* Keep content above the decorative accent bar */
  .page-wrap .space-y-4 > .bg-white.rounded-xl.shadow-md > *,
  .page-wrap .bg-white.rounded-xl.shadow-md.overflow-hidden > *,
  .page-wrap .law-item.bg-white.rounded-xl.shadow-md > *{
    position: relative;
    z-index: 1;
  }

  .page-wrap .space-y-4 > .bg-white.rounded-xl.shadow-md::after,
  .page-wrap .bg-white.rounded-xl.shadow-md.overflow-hidden::after,
  .page-wrap .law-item.bg-white.rounded-xl.shadow-md::after{
    content: "";
    position: absolute;
    left: 10px;
    top: 10px;
    bottom: 10px;
    width: 6px;
    height: auto;             /* avoid over-extending beyond card height */
    border-radius: 999px;
    background: linear-gradient(180deg, var(--moda-yellow-fix), #fde68a);
    opacity: 0;
    transition: opacity .18s ease;
    pointer-events: none;
    z-index: 0;
  }

  .page-wrap .space-y-4 > .bg-white.rounded-xl.shadow-md:hover,

      toggle.addEventListener('click', function(){

        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      document.addEventListener('click', function(e){
        if (!header.classList.contains('nav-open')) return;
        if (e.target.closest('.site-nav') || e.target.closest('#navToggle')) return;
