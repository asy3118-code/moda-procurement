<script>
(function(){
  const header = document.querySelector('.site-header');
  const toggle = document.getElementById('navToggle');
  const nav = document.getElementById('siteNav');
  if (!header || !toggle || !nav) return;

  const setOpen = (open) => {
    header.classList.toggle('nav-open', !!open);
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  };

  toggle.addEventListener('click', () => setOpen(!header.classList.contains('nav-open')));
  nav.addEventListener('click', (e) => { if (e.target.closest('a')) setOpen(false); });

  const current = (location.pathname.split('/').pop() || 'index.html').toLowerCase();
  nav.querySelectorAll('a.nav-link').forEach(a => {
    const href = (a.getAttribute('href') || '').toLowerCase();
    if (href === current || (current === 'index.html' && href === 'docs.html')) a.classList.add('is-active');
  });
})();
</script>


<script>
/* ===== MODA Procurement Site JS (GitHub Pages) ===== */
(function () {
  const openContent = (content) => {
    if (!content) return;

    // 先給一個足夠大的 maxHeight，避免 scrollHeight=0 時「看起來沒展開」
    content.style.maxHeight = "9999px";

    // 下一幀再以實際高度收斂（可保留動畫）
    requestAnimationFrame(() => {
      const h = content.scrollHeight;
      if (h > 0) content.style.maxHeight = h + "px";
    });

    // 圖片載入後再重新計算高度，避免被裁切或看不到
    content.querySelectorAll("img").forEach((img) => {
      if (img.complete) return;

      img.addEventListener("load", () => {
        if (content.style.maxHeight !== "0px") content.style.maxHeight = content.scrollHeight + "px";
      }, { once: true });

      img.addEventListener("error", () => {
        // 若 SVG/圖片路徑不存在，顯示提示
        const wrap = img.closest(".flowchart-wrap");
        if (wrap && !wrap.querySelector(".flowchart-error")) {
          const div = document.createElement("div");
          div.className = "flowchart-error";
          div.innerHTML = "找不到流程圖 SVG 檔案。請確認 GitHub Repo 根目錄有上傳 <b></b> 資料夾（含 SVG 檔），並且路徑大小寫正確。";
          wrap.appendChild(div);
        }
        if (content.style.maxHeight !== "0px") content.style.maxHeight = content.scrollHeight + "px";
      }, { once: true });
    });

    window.clearTimeout(content.__unlockTimer);
    content.__unlockTimer = window.setTimeout(() => {
      if (content.style.maxHeight !== "0px") content.style.maxHeight = "9999px";
    }, 520);
  };

  const closeContent = (content) => {
    if (!content) return;
    window.clearTimeout(content.__unlockTimer);
    // 先固定當前高度，再縮回 0，才會有動畫
    content.style.maxHeight = content.scrollHeight + "px";
    requestAnimationFrame(() => { content.style.maxHeight = "0px"; });
  };

  const collapseAllAccordions = (root=document) => {
    root.querySelectorAll(".accordion-content, .sub-accordion-content").forEach((c) => {
      window.clearTimeout(c.__unlockTimer);
      c.style.maxHeight = "0px";
    });
    root.querySelectorAll(".accordion-header.active, .sub-accordion-header.active").forEach((h) => {
      h.classList.remove("active");
    });
  };

  const initAccordions = () => {
    document.addEventListener("click", function (event) {
      const header = event.target.closest(".accordion-header, .sub-accordion-header");
      if (!header) return;

      const content = header.nextElementSibling;
      const opening = !header.classList.contains("active");
      header.classList.toggle("active");
      if (opening) openContent(content);
      else closeContent(content);
    });

    collapseAllAccordions();
  };

  // Search + highlight for laws page
  const removeHighlights = (container) => {
    if (!container) return;
    const highlights = container.querySelectorAll("span.search-highlight");
    highlights.forEach((node) => {
      const parent = node.parentNode;
      if (!parent) return;
      parent.replaceChild(document.createTextNode(node.textContent), node);
      parent.normalize();
    });
  };

  const applyHighlights = (container, term) => {
    if (!container || !term) return;
    const escaped = term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const regex = new RegExp("(" + escaped + ")", "gi");
    const targets = container.querySelectorAll(".text-lg, .font-semibold, .font-medium, a > span:first-child");
    targets.forEach((el) => {
      const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
      const nodes = [];
      let n;
      while ((n = walker.nextNode())) nodes.push(n);

      nodes.forEach((node) => {
        const text = node.nodeValue;
        if (!text || !regex.test(text)) return;
        const fragment = document.createDocumentFragment();
        const parts = text.split(regex);
        for (let i = 0; i < parts.length; i++) {
          if (i % 2 === 0) {
            if (parts[i]) fragment.appendChild(document.createTextNode(parts[i]));
          } else {
            const span = document.createElement("span");
            span.className = "search-highlight";
            span.style.color = "#D32F2F";
            span.style.fontWeight = "bold";
            span.textContent = parts[i];
            fragment.appendChild(span);
          }
        }
        node.parentNode.replaceChild(fragment, node);
      });
    });
  };

  const initLawSearch = () => {
    const input = document.getElementById("lawSearchInput");
    const list = document.getElementById("lawList");
    if (!input || !list) return;

    const items = Array.from(list.querySelectorAll(".law-item"));
    if (!items.length) return;

    input.addEventListener("input", function () {
      const term = this.value.trim();
      const termLower = term.toLowerCase();

      removeHighlights(list);
      items.forEach((item) => { item.style.display = ""; collapseAllAccordions(item); });

      if (!term) return;

      let firstMatch = null;

      items.forEach((item) => {
        const text = item.textContent.toLowerCase();
        const match = text.includes(termLower);
        if (!match) { item.style.display = "none"; return; }

        if (!firstMatch) firstMatch = item;
        applyHighlights(item, term);

        const mainHeader = item.querySelector(".accordion-header");
        const mainContent = item.querySelector(".accordion-content");
        if (mainHeader && mainContent) {
          mainHeader.classList.add("active");
          openContent(mainContent);

          const subHeaders = mainContent.querySelectorAll(".sub-accordion-header");
          subHeaders.forEach((subHeader) => {
            const subContent = subHeader.nextElementSibling;
            const subText = (subHeader.textContent + (subContent ? subContent.textContent : "")).toLowerCase();
            if (subText.includes(termLower)) { subHeader.classList.add("active"); openContent(subContent); }
          });
        }
      });

      if (firstMatch) firstMatch.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  };

  const initBackToTop = () => {
    const btn = document.getElementById("backToTop");
    if (!btn) return;
    const onScroll = () => {
      if (window.scrollY > 600) btn.classList.remove("hidden");
      else btn.classList.add("hidden");
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    btn.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
    onScroll();
  };

  document.addEventListener("DOMContentLoaded", () => {
    initAccordions();
    initLawSearch();
    initBackToTop();
  });
})();
</script>

</body>
</html>
